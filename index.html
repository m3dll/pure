  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px;display:flex;align-items:center;gap:10px;font:500 12px 'Geist Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);\"><\u002Fspan><span style=\"opacity:0.8;filter:saturate(0.85);\">💼<\u002Fspan> Métiers<\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:12px;\">\n          <div data-reveal=\"\" data-card=\"\" style=\"background:rgba(255,255,255,0.018);border:1px solid var(--line);border-radius:15px;padding:22px 24px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,background .45s ease,box-shadow .45s ease;\" style-hover=\"transform:translateY(-3px);border-color:rgba(209,31,58,0.42);background:rgba(255,255,255,0.032);box-shadow:0 16px 50px -18px rgba(192,20,46,0.3),inset 2px 0 0 var(--accent);\">\n            <h3 style=\"margin:0 0 9px;font:600 16px 'Geist';color:var(--ink);display:flex;align-items:center;gap:11px;\"><span style=\"font-size:17px;opacity:0.85;\">👮<\u002Fspan>Police (LSPD)<\u002Fh3>\n            <p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.65 'Geist';\">Patrouille, arrestations et menottage, fouilles et saisies de preuves. Accès au MDT (fiches, recherches, casiers), au dispatch en temps réel, aux gyrophares personnalisables et au radar Wraith ARS 2X (lecture de plaques, alerte 10-38 automatique). Casiers personnels verrouillés par code PIN au commissariat.<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" data-card=\"\" style=\"background:rgba(255,255,255,0.018);border:1px solid var(--line);border-radius:15px;padding:22px 24px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,background .45s ease,box-shadow .45s ease;\" style-hover=\"transform:translateY(-3px);border-color:rgba(209,31,58,0.42);background:rgba(255,255,255,0.032);box-shadow:0 16px 50px -18px rgba(192,20,46,0.3),inset 2px 0 0 var(--accent);\">\n            <h3 style=\"margin:0 0 9px;font:600 16px 'Geist';color:var(--ink);display:flex;align-items:center;gap:11px;\"><span style=\"font-size:17px;opacity:0.85;\">🚑<\u002Fspan>Ambulancier / EMS<\u002Fh3>\n            <p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.65 'Geist';\">Système de blessures, de réanimation et de soin automatique. Prise en charge des morts/inconscients et facturation des soins.<\u002Fp>\n            <span style=\"display:inline-block;margin-top:13px;font:500 11px 'Geist Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:4px 11px;\">Pas encore jouable<\u002Fspan>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" data-card=\"\" style=\"background:rgba(255,255,255,0.018);border:1px solid var(--line);border-radius:15px;padding:22px 24px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,background .45s ease,box-shadow .45s ease;\" style-hover=\"transform:translateY(-3px);border-color:rgba(209,31,58,0.42);background:rgba(255,255,255,0.032);box-shadow:0 16px 50px -18px rgba(192,20,46,0.3),inset 2px 0 0 var(--accent);\">\n            <h3 style=\"margin:0 0 9px;font:600 16px 'Geist';color:var(--ink);display:flex;align-items:center;gap:11px;\"><span style=\"font-size:17px;opacity:0.85;\">🔧<\u002Fspan>Mécanicien<\u002Fh3>\n            <p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.65 'Geist';\">Réparation et customisation des véhicules. Achat de marchandises en gros (kits de réparation, etc.) via un shop grossiste réservé au métier.<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" data-card=\"\" style=\"background:rgba(255,255,255,0.018);border:1px solid var(--line);border-radius:15px;padding:22px 24px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,background .45s ease,box-shadow .45s ease;\" style-hover=\"transform:translateY(-3px);border-color:rgba(209,31,58,0.42);background:rgba(255,255,255,0.032);box-shadow:0 16px 50px -18px rgba(192,20,46,0.3),inset 2px 0 0 var(--accent);\">\n            <h3 style=\"margin:0 0 9px;font:600 16px 'Geist';color:var(--ink);display:flex;align-items:center;gap:11px;\"><span style=\"font-size:17px;opacity:0.85;\">🚗<\u002Fspan>Premium Deluxe Motorsport (PDM)<\u002Fh3>\n            <p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.65 'Geist';\">Vente de véhicules via un catalogue NUI moderne (filtres prix/marque/catégorie, images, fiches détaillées, nombre de places et coffre affichés, prévisualisation et test drive). Les employés PDM peuvent faire des doubles de clés et ré-éditer une carte grise chez le serrurier.<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" data-card=\"\" style=\"background:rgba(255,255,255,0.018);border:1px solid var(--line);border-radius:15px;padding:22px 24px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,background .45s ease,box-shadow .45s ease;\" style-hover=\"transform:translateY(-3px);border-color:rgba(209,31,58,0.42);background:rgba(255,255,255,0.032);box-shadow:0 16px 50px -18px rgba(192,20,46,0.3),inset 2px 0 0 var(--accent);\">\n            <h3 style=\"margin:0 0 9px;font:600 16px 'Geist';color:var(--ink);display:flex;align-items:center;gap:11px;\"><span style=\"font-size:17px;opacity:0.85;\">🏠<\u002Fspan>Agent immobilier<\u002Fh3>\n            <p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.65 'Geist';\">Vente de maisons et gestion des propriétés. Pose de coffres à code PIN pour les habitants.<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" data-card=\"\" style=\"background:rgba(255,255,255,0.018);border:1px solid var(--line);border-radius:15px;padding:22px 24px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,background .45s ease,box-shadow .45s ease;\" style-hover=\"transform:translateY(-3px);border-color:rgba(209,31,58,0.42);background:rgba(255,255,255,0.032);box-shadow:0 16px 50px -18px rgba(192,20,46,0.3),inset 2px 0 0 var(--accent);\">\n            <h3 style=\"margin:0 0 9px;font:600 16px 'Geist';color:var(--ink);display:flex;align-items:center;gap:11px;\"><span style=\"font-size:17px;opacity:0.85;\">🏪<\u002Fspan>LTD / Épicerie (Strawberry)<\u002Fh3>\n            <p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.65 'Geist';\">Réapprovisionnement en gros du shop pour la revente.<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" data-card=\"\" style=\"background:rgba(255,255,255,0.018);border:1px solid var(--line);border-radius:15px;padding:22px 24px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,background .45s ease,box-shadow .45s ease;\" style-hover=\"transform:translateY(-3px);border-color:rgba(209,31,58,0.42);background:rgba(255,255,255,0.032);box-shadow:0 16px 50px -18px rgba(192,20,46,0.3),inset 2px 0 0 var(--accent);\">\n            <h3 style=\"margin:0 0 9px;font:600 16px 'Geist';color:var(--ink);display:flex;align-items:center;gap:11px;\"><span style=\"font-size:17px;opacity:0.85;\">🚌<\u002Fspan>Chauffeur de bus<\u002Fh3>\n            <p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.65 'Geist';\">Tournées de ramassage de PNJ autour de la map contre rémunération. Job en intérim (voir règlement).<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" data-card=\"\" style=\"background:rgba(255,255,255,0.018);border:1px solid var(--line);border-radius:15px;padding:22px 24px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,background .45s ease,box-shadow .45s ease;\" style-hover=\"transform:translateY(-3px);border-color:rgba(209,31,58,0.42);background:rgba(255,255,255,0.032);box-shadow:0 16px 50px -18px rgba(192,20,46,0.3),inset 2px 0 0 var(--accent);\">\n            <h3 style=\"margin:0 0 9px;font:600 16px 'Geist';color:var(--ink);display:flex;align-items:center;gap:11px;\"><span style=\"font-size:17px;opacity:0.85;\">🎤<\u002Fspan>Animateur<\u002Fh3>\n            <p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.65 'Geist';\">Menu dédié (F9) pour les events : soigner, réanimer et distribuer des items.<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" data-card=\"\" style=\"background:rgba(255,255,255,0.018);border:1px solid var(--line);border-radius:15px;padding:22px 24px;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,background .45s ease,box-shadow .45s ease;\" style-hover=\"transform:translateY(-3px);border-color:rgba(209,31,58,0.42);background:rgba(255,255,255,0.032);box-shadow:0 16px 50px -18px rgba(192,20,46,0.3),inset 2px 0 0 var(--accent);\">\n            <h3 style=\"margin:0 0 9px;font:600 16px 'Geist';color:var(--ink);display:flex;align-items:center;gap:11px;\"><span style=\"font-size:17px;opacity:0.85;\">💵<\u002Fspan>Patrons d’entreprise<\u002Fh3>\n            <p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.65 'Geist';\">Gestion des employés (embauche / renvoi), compte société en banque, facturation entre joueurs et paye automatique configurable depuis le téléphone (LB Phone · Services) : activation toutes les 15 min et montant réglable par grade.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding-top:72px;\">\n        <div data-reveal=\"\" style=\"display:flex;align-items:baseline;gap:16px;padding-bottom:18px;margin-bottom:30px;border-bottom:1px solid var(--line);\">\n          <span style=\"font:500 12px 'Geist Mono',monospace;letter-spacing:0.16em;color:var(--ink-faint);\">02<\u002Fspan>\n          <h2 style=\"margin:0;font:600 clamp(26px,4.5vw,34px) 'Geist',sans-serif;letter-spacing:-0.025em;color:#f3f3f5;display:flex;align-items:center;gap:13px;\"><span style=\"font-size:0.78em;opacity:0.85;\">🧍<\u002Fspan>Vie de joueur<\u002Fh2>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"margin:6px 0 14px;display:flex;align-items:center;gap:10px;font:500 12px 'Geist Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);\"><\u002Fspan><span style=\"opacity:0.8;\">📱<\u002Fspan> Quotidien et gestion<\u002Fdiv>\n        <div data-reveal=\"\" data-card=\"\" style=\"border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,0.012);overflow:hidden;transition:border-color .45s ease;\" style-hover=\"border-color:rgba(255,255,255,0.12);\">\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">📱 Téléphone (LB Phone)<\u002Fb> — Téléphone complet avec apps, contacts, messages et carte (Maps) affichant les commerces.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🏦 Banque<\u002Fb> — Comptes bancaires, dépôts/retraits, DAB en ville, possibilité de bloquer l’accès bancaire depuis un téléphone volé, etc.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🧑‍🤝‍🧑 Multi-personnages<\u002Fb> — Créez et gérez plusieurs personnages.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">👕 Apparence &amp; vêtements<\u002Fb> — Personnalisation complète du perso, penderie, aperçu 3D et gestion des tenues.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"margin:28px 0 14px;display:flex;align-items:center;gap:10px;font:500 12px 'Geist Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);\"><\u002Fspan><span style=\"opacity:0.8;\">🚙<\u002Fspan> Véhicules et logement<\u002Fdiv>\n        <div data-reveal=\"\" data-card=\"\" style=\"border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,0.012);overflow:hidden;transition:border-color .45s ease;\" style-hover=\"border-color:rgba(255,255,255,0.12);\">\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🚙 Garages &amp; véhicules<\u002Fb> — Garages modernes et véhicules personnels persistants : votre voiture reste là où vous la garez, même après déconnexion (plus de mise en fourrière automatique au logout). Clés de véhicule, clignotants et warning, appel de phares, changement de siège au pavé numérique, bâche de véhicule.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🏡 Logement &amp; déco<\u002Fb> — Achat/aménagement de maisons avec meubles, posters et graffitis décoratifs, coffres PIN.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"margin:28px 0 14px;display:flex;align-items:center;gap:10px;font:500 12px 'Geist Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);\"><\u002Fspan><span style=\"opacity:0.8;\">🍔<\u002Fspan> Confort et immersion<\u002Fdiv>\n        <div data-reveal=\"\" data-card=\"\" style=\"border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,0.012);overflow:hidden;transition:border-color .45s ease;\" style-hover=\"border-color:rgba(255,255,255,0.12);\">\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🍔 Survie &amp; HUD<\u002Fb> — Barres de faim/soif style GTA, radar étendu.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">😴 Confort<\u002Fb> — Votre perso reste en ville après votre déconnexion (il sauvegarde même la dernière emote !), mode photo libre, GPS tracker, écrans TV plaçables, renommage d’items.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🖐 Détails immersifs<\u002Fb> — Choix de la main directrice (droitier/gaucher) à la création, swap d’épaule à la visée, recul d’arme réaliste, arme visible dans le dos, minimap affichée uniquement en véhicule ou avec un téléphone, commande /wam pour dégainer ses armes de manière différente.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;opacity:0.7;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🪙 Fun<\u002Fb> — Pile ou face visible par tous, scoreboard, météo et heure synchronisées.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding-top:72px;\">\n        <div data-reveal=\"\" style=\"display:flex;align-items:baseline;gap:16px;padding-bottom:18px;margin-bottom:30px;border-bottom:1px solid rgba(209,31,58,0.3);\">\n          <span style=\"font:500 12px 'Geist Mono',monospace;letter-spacing:0.16em;color:var(--accent);\">03<\u002Fspan>\n          <h2 style=\"margin:0;font:600 clamp(26px,4.5vw,34px) 'Geist',sans-serif;letter-spacing:-0.025em;color:#f3f3f5;display:flex;align-items:center;gap:13px;\"><span style=\"font-size:0.78em;opacity:0.9;\">🚨<\u002Fspan>Illégal<\u002Fh2>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"margin:6px 0 14px;display:flex;align-items:center;gap:10px;font:500 12px 'Geist Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);\"><\u002Fspan><span style=\"opacity:0.8;\">💰<\u002Fspan> Braquages et vols<\u002Fdiv>\n        <div data-reveal=\"\" data-card=\"\" style=\"border:1px solid var(--line);border-radius:15px;background:rgba(209,31,58,0.025);overflow:hidden;transition:border-color .45s ease;\" style-hover=\"border-color:rgba(209,31,58,0.3);\">\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🏦 Braquage de banque<\u002Fb> — Casse des banques et sabotage des centrales électriques.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">💎 Bijouterie<\u002Fb> — Braquage des bijouteries pour un butin à revendre.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🏪 Magasins<\u002Fb> — Braquage de certains LTD de la map (argent et items).<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🚚 G6<\u002Fb> — Braquage de G6 pour cash et marchandises.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🏚 Cambriolage de maisons<\u002Fb> — Pillage de propriétés pour des objets à écouler.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🏧 Vol de DAB<\u002Fb> — Forcez les distributeurs automatiques de billets.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🚗 Vol de véhicules<\u002Fb> — Crochetage (lockpick), carjacking à main armée et vol de clés sur le conducteur. Les véhicules volés deviennent persistants (jusqu’au reboot).<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"margin:28px 0 14px;display:flex;align-items:center;gap:10px;font:500 12px 'Geist Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);\"><\u002Fspan><span style=\"opacity:0.8;\">🔫<\u002Fspan> Trafics et criminalité<\u002Fdiv>\n        <div data-reveal=\"\" data-card=\"\" style=\"border:1px solid var(--line);border-radius:15px;background:rgba(209,31,58,0.025);overflow:hidden;transition:border-color .45s ease;\" style-hover=\"border-color:rgba(209,31,58,0.3);\">\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">💊 Drogues<\u002Fb> — à découvrir en jeu.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🔫 Marché noir &amp; armes<\u002Fb> — Vendeurs d’armes et accessoires planqués, stashs protégés par code PIN, drive-by pour les passagers.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🎭 Discrétion<\u002Fb> — Cagoule utilisable sur un autre joueur pour l’empêcher de voir (la carte est également désactivée s’il n’a pas de téléphone dans l’inventaire, pour plus d’immersion), possibilité de se cacher dans le coffre d’un véhicule, et nouvel objet caméra espion pour surveiller.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🔓 Crochetage<\u002Fb> — à découvrir en jeu.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">💋 Prostitution<\u002Fb> — à découvrir en jeu.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:15px 22px;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;\"><\u002Fspan><p style=\"margin:0;color:var(--ink-soft);font:400 14.5px/1.6 'Geist';\"><b style=\"color:var(--ink);font-weight:600;\">🔥 Feu réaliste<\u002Fb> — Les incendies (molotov) sont dynamiques : le feu se propage, peut démarrer aléatoirement et doit être éteint par la police (extincteur).<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <footer data-reveal=\"\" style=\"position:relative;z-index:1;text-align:center;padding:56px 24px 90px;border-top:1px solid var(--line);\">\n    <div style=\"font:300 19px 'Geist';font-style:italic;color:var(--ink-soft);margin-bottom:12px;\">Bon jeu, et rendez-vous en ville ! 🌆<\u002Fdiv>\n    <div style=\"font:500 12px 'Geist Mono',monospace;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink-faint);\">Pure FR<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:1100},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b01228&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;,&quot;options&quot;:[&quot;#d11f3a&quot;,&quot;#b01228&quot;,&quot;#9a1b3c&quot;,&quot;#c2603a&quot;]},&quot;grain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Style&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const root = document.documentElement;\n    this.applyProps();\n\n    // scroll progress + sticky topbar border\n    this._onScroll = () => {\n      const max = root.scrollHeight - root.clientHeight;\n      const p = max > 0 ? Math.min(1, Math.max(0, root.scrollTop / max)) : 0;\n      const bar = document.getElementById('progress');\n      if (bar) bar.style.transform = 'scaleX(' + p + ')';\n      const hdr = document.getElementById('topbar');\n      if (hdr) hdr.style.borderBottomColor = root.scrollTop > 6 ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0)';\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n\n    this.setupReveal();\n  }\n\n  componentDidUpdate() { this.applyProps(); this.setupReveal(); }\n\n  applyProps() {\n    const accent = this.props.accent || '#d11f3a';\n    document.documentElement.style.setProperty('--accent', accent);\n    const grain = document.getElementById('grain');\n    if (grain) grain.style.display = (this.props.grain === false) ? 'none' : 'block';\n  }\n\n  setupReveal() {\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const animate = this.props.animate !== false && !reduce;\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    if (!animate || !('IntersectionObserver' in window)) {\n      els.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });\n      return;\n    }\n    if (this._io) this._io.disconnect();\n    els.forEach(el => {\n      if (el.__revealDone) return;\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(20px)';\n      el.style.transition = 'opacity .8s cubic-bezier(.22,1,.36,1), transform .8s cubic-bezier(.22,1,.36,1)';\n      el.style.willChange = 'opacity, transform';\n      const sibs = el.parentElement ? Array.from(el.parentElement.querySelectorAll(':scope > [data-reveal]')) : [el];\n      el.__delay = Math.min(sibs.indexOf(el), 6) * 65;\n    });\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          const el = e.target;\n          el.style.transitionDelay = (el.__delay || 0) + 'ms';\n          el.style.opacity = '1';\n          el.style.transform = 'none';\n          el.__revealDone = true;\n          this._io.unobserve(el);\n        }\n      });\n    }, { threshold: 0.1, rootMargin: '0px 0px -7% 0px' });\n    els.forEach(el => { if (!el.__revealDone) this._io.observe(el); });\n  }\n\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._io) this._io.disconnect();\n  }\n\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
